name: Deploy to Dokploy

# Dokploy listens only on the Tailscale network (port 3000 is firewalled off the
# public internet), so GitHub's webhooks can't reach it and Dokploy's built-in
# "Auto Deploy" never fires on push. Instead, on every push to the deploy branch
# this job joins the tailnet as an ephemeral node and calls Dokploy's deploy API
# directly, which pulls the latest commit, rebuilds the image and redeploys.
#
# Full explanation + reference: go2dev/vps-config → PUSH-TO-DEPLOY.md.

on:
  push:
    branches: [v2]          # v2 is the deploy/integration branch (see docs/deploy-runbook.md)
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # The OAuth client is scoped to tag:server (see vps-config runbook §3b).
          tags: tag:server
          # Use the tailnet's MagicDNS so `dokploy-prod` resolves.
          args: --accept-dns=true

      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          # Dokploy composeId for the "resistordivider.com" Compose app (Public Sites).
          COMPOSE_ID: Tpf5fkx5ARHxMBwZ5DFRg
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-connrefused --max-time 60 \
            -X POST "http://dokploy-prod:3000/api/compose.deploy" \
            -H "x-api-key: ${DOKPLOY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"${COMPOSE_ID}\"}"
          echo
          echo "Deploy request accepted by Dokploy."
