# Ingress/TLS is handled by Dokploy/Traefik, which forwards plain HTTP to :80.
# This server just serves the static site.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for fingerprint-free static assets. HTML and *.json (incl.
    # version.json, which the app polls to detect new deploys) are deliberately
    # left out so they revalidate and updates are picked up promptly.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|webm|mp4|ico|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
